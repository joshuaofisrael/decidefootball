name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          COMPLIANCE_GATE: GREEN
          NEXT_PUBLIC_SITE_URL: https://decidefootball.com
      - name: Assert GitHub Pages export
        run: |
          test -f out/index.html
          test -f out/CNAME
          test -f out/.nojekyll
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/about/index.html
          test -f out/methodology/index.html
          test -f out/guide/index.html
          test -f out/guide/start-sit/index.html
          test -f out/guide/waiver-radar/index.html
          test -f out/guide/listed-status/index.html
          test -f out/is-jordan-voss-playing-today/index.html
          test -f out/week-3/rb-rankings/index.html
          test -f out/start-sit/noah-crowe-vs-jordan-voss/index.html
          grep -q 'https://decidefootball.com/about/' out/sitemap.xml
          grep -q 'https://decidefootball.com/methodology/' out/sitemap.xml
          grep -q 'https://decidefootball.com/guide/</loc>' out/sitemap.xml
          grep -q 'https://decidefootball.com/guide/start-sit/' out/sitemap.xml
          grep -q 'https://decidefootball.com/guide/waiver-radar/' out/sitemap.xml
          grep -q 'https://decidefootball.com/guide/listed-status/' out/sitemap.xml
          ! grep -q 'https://decidefootball.com/start-sit/' out/sitemap.xml
          ! grep -q '/waiver-wire/' out/sitemap.xml
          ! grep -q '/is-playing/' out/sitemap.xml
          ! grep -q '/injuries/' out/sitemap.xml
          ! grep -q 'jordan-voss' out/sitemap.xml
          ! grep -q '/players/' out/sitemap.xml
          ! grep -q '/privacy/' out/sitemap.xml
          ! grep -q '/terms/' out/sitemap.xml
          ! grep -q '/disclaimer/' out/sitemap.xml
          ! grep -q '/cookies/' out/sitemap.xml
          grep -q 'Allow: /about/' out/robots.txt
          grep -q 'Allow: /methodology/' out/robots.txt
          grep -q '^Allow: /guide/$' out/robots.txt
          grep -q 'Allow: /guide/start-sit/' out/robots.txt
          grep -q 'Allow: /guide/waiver-radar/' out/robots.txt
          grep -q 'Allow: /guide/listed-status/' out/robots.txt
          ! grep -q 'Allow: /waiver-wire/' out/robots.txt
          ! grep -q 'Allow: /is-playing/' out/robots.txt
          ! grep -q 'Allow: /injuries/' out/robots.txt
          ! grep -q 'Allow: /privacy/' out/robots.txt
          ! grep -q 'Allow: /terms/' out/robots.txt
          ! grep -q 'Allow: /disclaimer/' out/robots.txt
          ! grep -q 'Allow: /cookies/' out/robots.txt
          ! grep -q 'Disallow: /privacy/' out/robots.txt
          ! grep -q 'Disallow: /terms/' out/robots.txt
          ! grep -q 'Disallow: /disclaimer/' out/robots.txt
          ! grep -q 'Disallow: /cookies/' out/robots.txt
          grep -q 'Disallow: /waiver-wire/' out/robots.txt
          grep -q 'Disallow: /players/' out/robots.txt
          grep -q 'Disallow: /start-sit/' out/robots.txt
          grep -q 'Disallow: /is-playing/' out/robots.txt
          grep -q 'Disallow: /is-' out/robots.txt
          grep -q 'Disallow: /injuries/' out/robots.txt
          grep -q 'Disallow: /week-' out/robots.txt
          grep -q 'Disallow: /slate/' out/robots.txt
          grep -q 'Disallow: /watchlist/' out/robots.txt
          grep -q 'Sitemap: https://decidefootball.com/sitemap.xml' out/robots.txt
          test -f out/llms.txt
          grep -q 'https://decidefootball.com/about/' out/llms.txt
          grep -q 'https://decidefootball.com/methodology/' out/llms.txt
          grep -q 'https://decidefootball.com/guide/ —' out/llms.txt
          grep -q 'https://decidefootball.com/guide/start-sit/' out/llms.txt
          grep -q 'https://decidefootball.com/guide/waiver-radar/' out/llms.txt
          grep -q 'https://decidefootball.com/guide/listed-status/' out/llms.txt
          grep -q 'not affiliated with the NFL' out/llms.txt
          grep -q 'sample/fixture' out/llms.txt
          test -f out/slate/index.html
          test -f out/watchlist/index.html
          grep -q 'content="noindex,follow"' out/index.html
          grep -q 'content="noindex,follow"' out/slate/index.html
          grep -q 'content="noindex,follow"' out/watchlist/index.html
          grep -q 'content="noindex,follow"' out/privacy/index.html
          grep -q 'content="noindex,follow"' out/terms/index.html
          grep -q 'content="noindex,follow"' out/disclaimer/index.html
          grep -q 'content="noindex,follow"' out/cookies/index.html
          ! grep -q '/slate/' out/sitemap.xml
          ! grep -q '/watchlist/' out/sitemap.xml
          grep -q 'content="index,follow"' out/about/index.html
          grep -q 'content="index,follow"' out/methodology/index.html
          grep -q 'content="index,follow"' out/guide/index.html
          grep -q 'content="index,follow"' out/guide/start-sit/index.html
          grep -q 'content="index,follow"' out/guide/waiver-radar/index.html
          grep -q 'content="index,follow"' out/guide/listed-status/index.html
          ! grep -q 'noindex' out/about/index.html
          ! grep -q 'noindex' out/methodology/index.html
          ! grep -q 'noindex' out/guide/index.html
          ! grep -q 'noindex' out/guide/start-sit/index.html
          ! grep -q 'noindex' out/guide/waiver-radar/index.html
          ! grep -q 'noindex' out/guide/listed-status/index.html
          grep -q 'FAQPage' out/about/index.html
          grep -q 'FAQPage' out/guide/start-sit/index.html
          grep -q 'FAQPage' out/guide/waiver-radar/index.html
          grep -q 'FAQPage' out/guide/listed-status/index.html
          grep -q 'WebPage' out/about/index.html
          grep -q 'WebPage' out/methodology/index.html
          grep -q 'WebPage' out/guide/index.html
          grep -q 'ItemList' out/guide/index.html
          grep -q 'WebPage' out/guide/start-sit/index.html
          grep -q 'WebPage' out/guide/waiver-radar/index.html
          grep -q 'WebPage' out/guide/listed-status/index.html
          grep -q 'content="noindex,follow"' out/waiver-wire/week-3/index.html
          grep -q 'How to read the tags' out/waiver-wire/week-3/index.html
          grep -q 'content="noindex,follow"' out/start-sit/index.html
          grep -q 'content="noindex,follow"' out/players/index.html
          ! grep -q 'SAMPLE / FIXTURE' out/about/index.html
          ! grep -q 'jordan-voss' out/about/index.html
          ! grep -q 'SAMPLE / FIXTURE' out/methodology/index.html
          ! grep -q 'SAMPLE / FIXTURE' out/guide/index.html
          ! grep -q 'jordan-voss' out/guide/index.html
          grep -q 'href="/guide/"' out/guide/start-sit/index.html
          grep -q 'href="/guide/"' out/guide/waiver-radar/index.html
          grep -q 'href="/guide/"' out/guide/listed-status/index.html
          grep -q 'href="/guide/"' out/about/index.html
          grep -q 'href="/guide/"' out/methodology/index.html
          ! grep -q 'SAMPLE / FIXTURE' out/guide/start-sit/index.html
          ! grep -q 'jordan-voss' out/guide/start-sit/index.html
          ! grep -q 'SAMPLE / FIXTURE' out/guide/waiver-radar/index.html
          ! grep -q 'jordan-voss' out/guide/waiver-radar/index.html
          ! grep -q 'SAMPLE / FIXTURE' out/guide/listed-status/index.html
          ! grep -q 'jordan-voss' out/guide/listed-status/index.html
          grep -q 'guide/waiver-radar/' out/waiver-wire/week-3/index.html
          grep -q 'content="noindex,follow"' out/is-playing/index.html
          grep -q 'guide/listed-status/' out/is-playing/index.html
          grep -q 'How to read the status' out/is-playing/index.html
          grep -q 'content="noindex,follow"' out/is-jordan-voss-playing-today/index.html
          grep -q 'guide/listed-status/' out/is-jordan-voss-playing-today/index.html
          grep -q 'content="noindex,follow"' out/injuries/jordan-voss/index.html
          grep -q 'guide/listed-status/' out/injuries/jordan-voss/index.html
          grep -qx 'decidefootball.com' out/CNAME
          test -f out/ads.txt
          ! grep -q '^google.com,' out/ads.txt
          ! grep -q 'aria-label="Advertisement"' out/index.html
          ! grep -q 'adsbygoogle.js' out/index.html
          ! grep -q 'Advertisement' out/start-sit/noah-crowe-vs-jordan-voss/index.html
