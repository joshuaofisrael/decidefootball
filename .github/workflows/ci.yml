          import pathlib, re
          snippet = """<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "9c4f710ff2a04acb99c29039ac218aea"}'></script><!-- End Cloudflare Web Analytics -->"""
          slot = f'<div id="cf-web-analytics" hidden="">{snippet}</div>'
          script_re = re.compile(r"<script type='module' src='https://static\.cloudflareinsights\.com/beacon\.min\.js'[^>]*>\s*</script>")
          for rel in ("out/index.html", "out/about/index.html", "out/guide/index.html", "out/privacy/index.html", "out/cookies/index.html"):
