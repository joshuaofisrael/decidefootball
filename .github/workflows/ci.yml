          import pathlib, re
          xml = pathlib.Path("out/sitemap.xml").read_text()
          blocks = re.findall(r"<url>\s*(.*?)\s*</url>", xml, flags=re.S)
          if len(blocks) != 69:
              raise SystemExit(f"sitemap has {len(blocks)} urls, expected 69")
          for block in blocks:
              loc = re.search(r"<loc>([^<]+)</loc>", block)
              mods = re.findall(r"<lastmod>([^<]+)</lastmod>", block)
              if not loc or len(mods) != 1 or not re.fullmatch(r"\d{4}-\d{2}-\d{2}", mods[0]):
